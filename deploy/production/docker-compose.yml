name: localapp

services:
  server:
    image: ${LOCALAPP_IMAGE:?LOCALAPP_IMAGE is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "30666:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:?BOOTSTRAP_API_KEY is required}
      MINIO_ENDPOINT: 127.0.0.1:1
      MINIO_ACCESS_KEY: local-storage
      MINIO_SECRET_KEY: local-storage
      MINIO_BUCKET: localapp-content
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

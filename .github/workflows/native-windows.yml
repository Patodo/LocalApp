name: Windows native adapter

on:
  pull_request:
    paths:
      - ".github/workflows/native-windows.yml"
      - "packages/localapp/native/windows/**"
      - "packages/localapp/native/common/**"
      - "packages/localapp/scripts/build-native-adapter.mjs"
      - "scripts/build-windows-release.ps1"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-windows.yml"
      - "packages/localapp/native/windows/**"
      - "packages/localapp/native/common/**"
      - "packages/localapp/scripts/build-native-adapter.mjs"
      - "scripts/build-windows-release.ps1"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  native-adapter:
    name: Windows x64 native adapter
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/localapp/native/windows
          shared-key: native-windows-x64

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/localapp test:native

      - name: Build native adapter
        shell: pwsh
        run: ./scripts/build-windows-release.ps1 -Mode Test -SkipInstall -OutputDirectory dist/windows-native

      - uses: actions/upload-artifact@v4
        with:
          name: localapp-native-win32-x64
          if-no-files-found: error
          path: dist/windows-native/**

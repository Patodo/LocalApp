[package]
name = "localapp"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "localapp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
dialoguer = "0.11"
include_dir = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
localapp-core = { path = "../localapp-core" }
localapp-template = { path = "../localapp-template" }

[dev-dependencies]
httpmock = "0.7"
portable-pty = "0.9"
tempfile = "3"

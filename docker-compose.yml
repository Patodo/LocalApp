services:
  localapp:
    build: .
    image: localapp:local
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=change-me-in-production
      - BOOTSTRAP_API_KEY=change-me-in-production
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=localapp-content
    volumes:
      - localapp-data:/app/data
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

volumes:
  localapp-data:
  minio-data:
